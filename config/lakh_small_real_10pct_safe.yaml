initialize_from_hf_checkpoint: "artifacts/hf-converted/music-small-800k-bin"

data:
  train_urls:
    - "../../anticipation/data/lmd_10pct/train.txt"
  validation_urls:
    - "../../anticipation/data/lmd_10pct/valid.txt"
  cache_dir: "artifacts/real-cache-10pct/"
  tokenizer: "passthrough"
  plaintext: true
  enforce_eos: false
  num_train_shards: 32
  num_val_shards: 8
  train_group_size: 256
  val_group_size: 128

model:
  hidden_dim: 768
  num_heads: 12
  num_layers: 12
  seq_len: 1024
  scale_attn_by_inverse_layer_idx: true
  embed_pdrop: 0.1
  resid_pdrop: 0.1
  attn_pdrop: 0.1
  gradient_checkpointing: true
  gradient_checkpointing_block_size: 5

trainer:
  mp: p=f32,c=bfloat16
  learning_rate: 6E-4
  weight_decay: 0.1
  model_axis_size: 1

  # Safe defaults for laptop-class hardware
  train_batch_size: 4
  per_device_parallelism: 1
  per_device_eval_parallelism: 1
  num_train_steps: 2000
  steps_per_eval: 200
  load_last_checkpoint: false

  wandb:
    mode: "disabled"

  checkpointer:
    base_path: "artifacts/real-checkpoints-10pct/"
    save_interval: 30m

  axis_resources:
    batch: "data"
    vocab: "model"
    mlp: "model"
    heads: "model"

  parameter_axis_resources:
    embed: "data"
